name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release (devices with automatic updates install it)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Shell helpers against a simulated TV
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwiiosBuild=${{ github.run_number }} testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 819200 || { echo "APK is over 800 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      # Ready to install without a JDK or SDK: APK_FILE=app-release.apk TV_HOST=<ip> launcher/build-and-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WiiOS-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk

  # WiiOS for computers (desktop/): the same menu as a Tauri app. Every version is built from the same commit
  # with the same build number, so one release carries all of them.
  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Tests and build
        working-directory: desktop
        env:
          WIIOS_BUILD: ${{ github.run_number }}
        shell: bash
        run: |
          npm ci
          node scripts/prepare.mjs
          (cd src-tauri && cargo test --release)
          npx tauri build --no-bundle
          cp src-tauri/target/release/wiios.exe ../WiiOS-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: WiiOS-windows
          path: WiiOS-windows-x64.exe

  desktop-linux:
    name: Desktop (Linux)
    # The oldest supported Ubuntu, so the AppImage runs on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - name: Tests and build
        working-directory: desktop
        env:
          WIIOS_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          node --test tests/*.test.mjs
          (cd src-tauri && cargo test --release)
          npx tauri build
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../WiiOS-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: WiiOS-linux
          path: WiiOS-linux-x86_64.AppImage

  # Over-the-air updates: every build of main (or a manual run with "publish") becomes release build-<N> with
  # every version attached. Each one's updater picks its own file: the TV the .apk, Windows the .exe, Linux the
  # AppImage.
  publish:
    name: Publish release
    needs: [lists-and-tools, launcher, desktop-windows, desktop-linux]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ github.run_number }}
          cp artifacts/WiiOS-apk/app-release.apk "WiiOS-build-$n.apk"
          gh release create "build-$n" "WiiOS-build-$n.apk" \
            artifacts/WiiOS-windows/WiiOS-windows-x64.exe artifacts/WiiOS-linux/WiiOS-linux-x86_64.AppImage \
            --target "${{ github.sha }}" --title "WiiOS $(cat VERSION) (build $n)" --notes "$(git log -1 --pretty=%B)"
