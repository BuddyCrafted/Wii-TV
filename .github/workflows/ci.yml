name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release (devices with automatic updates install it)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Shell helpers against a simulated TV
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishing releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PwiiosBuild=${{ github.run_number }} testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 819200 || { echo "APK is over 800 KB; the launcher targets 1 GB TVs, keep it small"; exit 1; }
      # Ready to install without a JDK or SDK: APK_FILE=app-release.apk TV_HOST=<ip> launcher/build-and-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wiiOS-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
      # Over-the-air updates: every build of main (or a manual run with "publish") becomes release build-<N>,
      # which the in-app updater installs on devices with an older build.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=${{ github.run_number }}
          cp launcher/app/build/outputs/apk/release/app-release.apk "wiiOS-build-$n.apk"
          gh release create "build-$n" "wiiOS-build-$n.apk" --target "${{ github.sha }}" \
            --title "wiiOS build $n" --notes "$(git log -1 --pretty=%B)"
