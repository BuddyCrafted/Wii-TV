plugins {
    id 'com.android.application'
}

def wiiosBuild = (providers.gradleProperty('wiiosBuild').getOrElse('0')) as int
// The version people see (1.0, 1.1, 2.0...), shared by every WiiOS version: the VERSION file at the repository root.
def wiiosVersion = rootProject.file('../VERSION').text.trim()

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        // CI passes -PwiiosBuild=<run number>; the in-app updater installs a release whose build is higher.
        versionCode 100 + wiiosBuild
        versionName "${wiiosVersion} (build ${wiiosBuild})"
        buildConfigField 'int', 'WIIOS_BUILD', "${wiiosBuild}"
        buildConfigField 'String', 'WIIOS_VERSION', "\"${wiiosVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    // One fixed key for every build, so the in-app updater can install a newer release over an older one
    // (Android refuses an update signed by a different key). The key in keys/ is public on purpose: the updater
    // only ever downloads from this repository's own GitHub releases. To use a private key instead, set
    // WIIOS_KEYSTORE (path), WIIOS_KEYSTORE_PASSWORD, WIIOS_KEY_ALIAS and WIIOS_KEY_PASSWORD; installs signed
    // with the other key then have to be uninstalled once.
    signingConfigs {
        wiios {
            storeFile file(System.getenv('WIIOS_KEYSTORE') ?: rootProject.file('keys/wiios-release.jks').path)
            storePassword System.getenv('WIIOS_KEYSTORE_PASSWORD') ?: 'wiios-public'
            keyAlias System.getenv('WIIOS_KEY_ALIAS') ?: 'wiios'
            keyPassword System.getenv('WIIOS_KEY_PASSWORD') ?: 'wiios-public'
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.wiios
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
