<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Wii TV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Everything is laid out on a fixed 1920x1080 stage and scaled to the screen. -->
  <div id="stage">

    <main id="menu" aria-label="Channels">
      <div id="pages"></div>

      <button class="page-arrow left" id="arrow-left" aria-label="Previous page" tabindex="-1">
        <svg viewBox="0 0 60 90"><path d="M48 8 L10 45 L48 82 Z"/></svg>
      </button>
      <button class="page-arrow right" id="arrow-right" aria-label="Next page" tabindex="-1">
        <svg viewBox="0 0 60 90"><path d="M12 8 L50 45 L12 82 Z"/></svg>
      </button>

      <div id="balloon" class="balloon" hidden></div>

      <footer id="bar">
        <svg class="bar-shape" viewBox="0 0 1920 300" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7f7f7"/>
              <stop offset="1" stop-color="#d9dadb"/>
            </linearGradient>
          </defs>
          <path class="bar-body" d="M0 30 H250 C330 30 360 120 450 120 H1470 C1560 120 1590 30 1670 30 H1920 V300 H0 Z" fill="url(#barFill)"/>
          <path class="bar-edge" d="M0 30 H250 C330 30 360 120 450 120 H1470 C1560 120 1590 30 1670 30 H1920" fill="none"/>
        </svg>

        <div id="clock" class="clock" aria-live="off">
          <span id="clock-hm">12:00</span><span id="clock-ampm" class="ampm">PM</span>
        </div>
        <div id="date" class="date">Wed 10/21</div>

        <button class="round-btn wii" id="btn-wii" data-bar="0" tabindex="-1">
          <span class="round-inner">Wii</span>
        </button>
        <button class="round-btn mail" id="btn-mail" data-bar="1" tabindex="-1">
          <span class="round-inner">
            <svg viewBox="0 0 64 44" aria-hidden="true"><rect x="3" y="3" width="58" height="38" rx="5"/><path d="M5 6 L32 26 L59 6"/></svg>
          </span>
        </button>
      </footer>
    </main>

    <!-- Channel preview: shown after choosing a channel, before launching it. -->
    <section id="channel" class="screen" hidden>
      <div class="channel-art" id="channel-art"></div>
      <div class="channel-buttons">
        <button class="pill" data-action="menu" tabindex="-1">Wii Menu</button>
        <button class="pill" data-action="start" tabindex="-1">Start</button>
      </div>
    </section>

    <!-- Wii button menu -->
    <section id="options" class="panel-screen" hidden>
      <div class="panel">
        <h2>Wii TV Menu</h2>
        <ul class="list" id="options-list"></ul>
        <p class="hint">BACK to close</p>
      </div>
    </section>

    <!-- Message board -->
    <section id="board" class="panel-screen" hidden>
      <div class="panel board">
        <h2 id="board-date"></h2>
        <ul class="list" id="board-list"></ul>
        <p class="hint">BACK to close</p>
      </div>
    </section>

    <!-- Cold-start notice -->
    <section id="boot" class="screen boot" hidden>
      <div class="boot-inner">
        <h1><span class="warn">&#9888;</span> WARNING-HEALTH AND SAFETY</h1>
        <p>Take a break now and then. Sit back from the TV, keep a snack nearby,<br>
          and remember to stretch between episodes.</p>
        <p class="boot-press">Press <b>OK</b> to continue.</p>
      </div>
    </section>

    <!-- Pointing hand that follows the selection -->
    <div id="hand" aria-hidden="true">
      <svg viewBox="0 0 64 80">
        <path d="M22 6c4 0 6 3 6 7v22l2-1V9c0-4 2-6 6-6s6 2 6 6v25l2 0V14c0-4 2-6 6-6s5 2 5 6v24l1 0v-8c0-4 2-6 5-6s5 2 5 6v20c0 16-9 26-24 26S16 66 10 54L2 40c-2-4-1-7 2-8 3-2 6-1 9 3l3 5V13c0-4 2-7 6-7z"/>
      </svg>
    </div>

    <div id="flash" aria-hidden="true"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
